services:
  - type: web
    name: renko-atr-pro-cockpit
    runtime: python
    plan: starter
    buildCommand: "python3 -m unittest discover -s tests"
    startCommand: "python3 server.py"
    healthCheckPath: /healthz
    envVars:
      - key: CAPITAL_ENV
        value: demo
      - key: AUTO_START_WATCHER
        value: "false"
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_IDENTIFIER
        sync: false
      - key: CAPITAL_PASSWORD
        sync: false
